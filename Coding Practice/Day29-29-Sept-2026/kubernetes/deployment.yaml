apiVersion: v1
kind: Deployment 
metadata:
  name: pathnex-nginx 
spec:
  replicas: 2 

  selector:
    matchLabels:
      app: pathnex-nginx 
  
  template: 
    metadata: 
      labels: 
        app: pathnex-nginx 

    spec: 
      containers:
        - name: nginx 
          image: nginx:latest 

          ports:
            - containerPort: 80

          volumeMounts:
            - name: html-storage
              mountPath: /usr/share/nginx/html

       volumes: 
        - name: html-storage
          persistentVolumeClaim: 
            claimName: pathnex-pvc 