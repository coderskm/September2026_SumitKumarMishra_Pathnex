apiVersion: apps/v1
kind: deployment 
metadata: 
  name: pathnex-deployment 
spec: 
  replicas: 3 
  selector:
    matchLabels:
      app: pathnex-app
  template: 
    metadata: 
      labels: 
        app: pathnex-app 
    spec: 
      containers:
        - name: app
          image: nginx
          ports: 
            - containerPort: 80